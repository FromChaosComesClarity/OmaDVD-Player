# OmaDVD-Player — extra key bindings.
#
# The navigation keys (arrows, Enter, Esc, Backspace, Space, m, q, e ...) are
# claimed by omadvd.lua with forced bindings so that the same key drives the
# menu when it is open and the transport when it is not. They are deliberately
# NOT listed here -- the script owns them, and that is what makes one gamepad
# button do the obvious thing in both contexts.
#
# This file is for additions that do not need to know about the menu.

# Volume, for a tube whose own knob is across the room.
9      add volume -5
0      add volume  5
m      ignore
# ^ 'm' is the menu in OmaDVD, not mute. Mute is on the gamepad-free path below.
CTRL+m cycle mute

# Coarse seeking, in case a chapter is not granular enough.
PGUP   add chapter  1
PGDWN  add chapter -1

# Frame-accurate nudging while paused, for finding a scene.
.      frame-step
,      frame-back-step
