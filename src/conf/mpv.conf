# OmaDVD-Player — mpv profile for a composite-fed CRT at 720x480 / 480i.
#
# Every value here is chosen for ONE target: a Mac-Mini-class Haswell iGPU
# with no VAAPI driver, rendering a 720x480 framebuffer that an HDMI->composite
# adapter re-interlaces onto a 4:3 tube. See docs/DESIGN.md for the reasoning;
# the short version is in the comments below.

# ── Output ───────────────────────────────────────────────────────────────────
vo=gpu
gpu-api=opengl
fullscreen=yes
border=no
# The tube is the only display. A title bar costs scanlines we cannot spare.

# MPEG-2 at 720x480 is a few percent of one core in software. This machine has
# no VAAPI driver installed at all (no /usr/lib/dri/i965_drv_video.so), so
# "auto" only buys a failed probe and a log full of noise.
hwdec=no

# ── Aspect ───────────────────────────────────────────────────────────────────
# THE load-bearing CRT setting, and the one thing every naive DVD setup gets
# wrong here. A 720x480 framebuffer displayed as 4:3 has non-square pixels
# (PAR 8:9) -- exactly the BT.601 geometry a DVD is already stored in. mpv
# assumes square pixels, so it would "correct" a 4:3 disc to 640x480 and
# pillarbox it, and the tube would then stretch that back out too wide.
#
# The fix is to lie to mpv by the ratio between the framebuffer's shape and the
# screen's shape: (720/480) / (4/3) = 9/8. omadvd.lua computes and applies
# video-aspect-override at runtime from the disc's own flags; it is left at the
# default here so the script is the single source of truth.
keepaspect=yes
video-aspect-method=container

# ── Scaling ──────────────────────────────────────────────────────────────────
# With the aspect fix above, a 4:3 disc lands 1:1 on the framebuffer and the
# scaler is a no-op. There is nothing for an expensive kernel to reconstruct at
# 480 lines, so spend nothing.
scale=bilinear
dscale=bilinear
cscale=bilinear
correct-downscaling=no
sigmoid-upscaling=no
interpolation=no
deband=no
# Composite adds far more noise than dithering could ever hide.
dither-depth=no

# ── Deinterlacing ────────────────────────────────────────────────────────────
# Off by default, deliberately. Nearly every film DVD is SOFT telecined --
# progressive frames plus repeat-field flags -- and ffmpeg already honours those
# flags, so the output is clean without touching it. Deinterlacing that costs
# CPU and softens the picture for nothing.
#
# Hard-interlaced content (concert films, TV episodes, some extras) does need
# it: OmaDVD's Picture menu cycles no -> bwdif -> yadif live.
deinterlace=no

# ── Audio ────────────────────────────────────────────────────────────────────
# Composite carries stereo. Without this a 5.1 AC-3 track drops the centre
# channel, which is where the dialogue lives -- the classic "I can hear the
# explosions but not the words" failure.
audio-channels=stereo
audio-display=no

# ── Subtitles ────────────────────────────────────────────────────────────────
# DVD subtitles are bitmaps authored at 720x480. They land pixel-exact; leave
# them alone.
sub-auto=no
stretch-dvd-subs=no

# ── Input ────────────────────────────────────────────────────────────────────
# mpv has first-class gamepad input (SDL2), so this needs no daemon and works
# even with OmaCRT's own input daemon disabled. GAMEPAD_* keys are bound in the
# script alongside their keyboard equivalents.
input-gamepad=yes

# ── Behaviour ────────────────────────────────────────────────────────────────
# End of a title returns to OmaDVD's menu instead of closing the player.
keep-open=yes
idle=yes
# ⚠️ Without this the window is destroyed the moment no file is loaded, which is
# exactly the state the "No disc" screen lives in -- so ejecting would black the
# screen out and there would be nothing left to draw the waiting menu on.
force-window=yes
# OmaDVD draws the entire interface itself, and mpv's own OSD would be an
# unreadable hairline at this resolution, so it is switched off completely.
#
# Verified, because the opposite is the obvious worry: level 0 is documented as
# "OSD fully disabled", but a script's osd-overlay is NOT part of that. Rendered
# the same overlay at level 0 and at the default and compared the two window
# captures -- byte-for-byte identical. Our UI is safe here; only mpv's own
# status text and progress bar are suppressed, which is the point.
osd-level=0
osd-bar=no
cursor-autohide=100
# A CRT is not a desktop: never let a stray watch-later file resume something
# the menu did not ask for. OmaDVD keeps its own per-disc resume state.
save-position-on-quit=no
resume-playback=no
